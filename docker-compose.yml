services:
  backend:
    build: ./backend
    container_name: tmdb-movie-backend
    restart: unless-stopped
    environment:
      - PORT=8008
      - ADMIN_USERNAME=admin
      # 请修改为你自己的管理员密码！
      - ADMIN_PASSWORD=admin123
      # 生产必填：openssl rand -hex 32
      - AUTH_SECRET=
      - ENCRYPTION_KEY=
      # 二选一：环境变量配置 TMDB Key，或在网页「设置」页填写
      - TMDB_API_KEY=
      - TMDB_LANGUAGE=zh-CN
      - IMAGE_PROXY_BASE=
      - CACHE_TTL=3600
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8008/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: tmdb-movie-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

# 使用说明：
# 1. 修改上方 ADMIN_PASSWORD / AUTH_SECRET / ENCRYPTION_KEY（openssl rand -hex 32 生成）
# 2. 启动：docker compose up -d --build
# 3. 访问 http://<NAS-IP>:8080，登录后在「设置」页填入你的 TMDB API Key
