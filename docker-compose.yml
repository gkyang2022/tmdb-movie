services:
  backend:
    build: ./backend
    container_name: quarkcine-backend
    restart: unless-stopped
    ports:
      - "8009:8008"
    environment:
      - PORT=8008
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=                        # 必填：设置你的管理员密码
      - AUTH_SECRET=                           # 必填：openssl rand -hex 32 生成
      - ENCRYPTION_KEY=                        # 必填：openssl rand -hex 32 生成（AES-256-GCM 加密存储）
      - TMDB_API_KEY=                          # 可选：也可在网页设置页填写 TMDB Key
      - TMDB_LANGUAGE=zh-CN
      - IMAGE_PROXY_BASE=
      - CACHE_TTL=3600
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    container_name: quarkcine-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
